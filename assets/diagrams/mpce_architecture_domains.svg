  <rect x="20" y="330" width="1060" height="100" rx="12" fill="#f0fdfa" stroke="#1f7a7a" stroke-width="1.5"/>
  <rect x="20" y="330" width="140" height="100" rx="10" fill="#1f7a7a"/>
  <text class="ht" x="90" y="378">计算方法</text>
  <text class="hs" x="90" y="398">Computation</text>
  <g stroke="#1f7a7a">
    <rect class="card" x="180" y="348" width="133" height="64" rx="8"/>
    <rect class="card" x="329" y="348" width="133" height="64" rx="8"/>
    <rect class="card" x="478" y="348" width="133" height="64" rx="8"/>
    <rect class="card" x="627" y="348" width="133" height="64" rx="8"/>
    <rect class="card" x="776" y="348" width="133" height="64" rx="8"/>
    <rect class="card" x="925" y="348" width="133" height="64" rx="8"/>
  </g>
  <text class="ct" x="246.5" y="376">FDM</text><text class="cs" x="246.5" y="396">有限差分</text>
  <text class="ct" x="395.5" y="376">FEM</text><text class="cs" x="395.5" y="396">有限元</text>
  <text class="ct" x="544.5" y="376">FVM</text><text class="cs" x="544.5" y="396">有限体积</text>
  <text class="ct" x="693.5" y="376">Monte Carlo</text><text class="cs" x="693.5" y="396">蒙特卡洛 / MCMC</text>
  <text class="ct" x="842.5" y="376">反问题</text><text class="cs" x="842.5" y="396">Inverse Problems</text>
  <text class="ct" x="991.5" y="376">SciML</text><text class="cs" x="991.5" y="396">PINNs · 神经算子</text>

  <!-- ===== Band 4: 工程应用 (Green) ===== -->
  <rect x="20" y="480" width="1060" height="188" rx="12" fill="#f0fdf4" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="20" y="480" width="140" height="188" rx="10" fill="#2e7d32"/>
  <text class="ht" x="90" y="572">工程应用</text>
  <text class="hs" x="90" y="592">7 大领域 · Domains</text>
  <g stroke="#2e7d32">
    <rect class="card" x="180" y="498" width="208" height="64" rx="8"/>
    <rect class="card" x="404" y="498" width="208" height="64" rx="8"/>
    <rect class="card" x="628" y="498" width="208" height="64" rx="8"/>
    <rect class="card" x="852" y="498" width="208" height="64" rx="8"/>
    <rect class="card" x="180" y="578" width="208" height="72" rx="8"/>
    <rect class="card" x="404" y="578" width="208" height="72" rx="8"/>
    <rect class="card" x="628" y="578" width="208" height="72" rx="8"/>
  </g>
  <text class="ct" x="284" y="526">① 人工智能与数据科学</text><text class="cs" x="284" y="546">AI &amp; Data Science</text>
  <text class="ct" x="508" y="526">② 半导体与集成电路</text><text class="cs" x="508" y="546">Semiconductors &amp; IC</text>
  <text class="ct" x="732" y="526">③ 机器人与具身智能</text><text class="cs" x="732" y="546">Robotics &amp; Embodied AI</text>
  <text class="ct" x="956" y="526">④ 先进制造与多物理场</text><text class="cs" x="956" y="546">Adv. Mfg. &amp; Multiphysics</text>
  <text class="ct" x="284" y="610">⑤ 计算物理与材料科学</text><text class="cs" x="284" y="630">Comp. Physics &amp; Materials</text>
  <text class="ct" x="508" y="610">⑥ 体系结构与高性能计算</text><text class="cs" x="508" y="630">Computer Arch. &amp; HPC</text>
  <text class="ct" x="732" y="610">⑦ 医学成像与生物医学工程</text><text class="cs" x="732" y="630">Medical Imaging &amp; BME</text>
  <!-- cross-domain coupling note -->
  <rect x="852" y="578" width="208" height="72" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text class="ct" x="956" y="597" style="font-size:13px">跨领域耦合 Cross-links</text>
  <text class="xs" x="956" y="615">⑥ → ① ⑤　算力支撑</text>
  <text class="xs" x="956" y="630">① → ④ PINNs　① → ⑦ 医学 AI</text>
  <text class="xs" x="956" y="645">② → ⑤　器件物理</text>

  <!-- ===== Flows ===== -->
  <line class="flow" x1="560" y1="130" x2="560" y2="179"/>
  <text class="lb" x="572" y="159">数学建模语言</text>
  <line class="flow" x1="560" y1="280" x2="560" y2="329"/>
  <text class="lb" x="572" y="309">控制方程 · PDE</text>
  <line class="flow" x1="1010" y1="130" x2="1010" y2="329"/>
  <text class="lb" x="1000" y="226" text-anchor="end">数值分析</text>
  <text class="lb" x="1000" y="242" text-anchor="end">离散化</text>
  <line class="flow" x1="560" y1="430" x2="560" y2="479"/>
  <text class="lb" x="572" y="459">求解 · 仿真 · 推断</text>

  <!-- ===== Cross-cutting pillar ===== -->
  <rect x="1100" y="30" width="70" height="638" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <g font-size="20" font-weight="700" fill="#b91c1c" text-anchor="middle">
    <text x="1135" y="232">数</text>
    <text x="1135" y="266">学</text>
    <text x="1135" y="300">物</text>
    <text x="1135" y="334">理</text>
    <text x="1135" y="368">通</text>
    <text x="1135" y="402">用</text>
    <text x="1135" y="436">语</text>
    <text x="1135" y="470">言</text>
  </g>
  <text x="1135" y="628" font-size="11" fill="#b91c1c" text-anchor="middle">Common</text>
  <text x="1135" y="644" font-size="11" fill="#b91c1c" text-anchor="middle">Language</text>
</svg>
