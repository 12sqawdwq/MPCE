<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="MPCE 架构：数学基础 → 物理机制 → 计算方法 → 7 大工程应用">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .ht { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .hs { font-size: 12px; fill: #ffffff; fill-opacity: 0.9; text-anchor: middle; }
      .ct { font-size: 14px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .cs { font-size: 12px; fill: #475569; text-anchor: middle; }
      .xs { font-size: 11px; fill: #475569; text-anchor: middle; }
      .lb { font-size: 12px; fill: #475569; }
      .card { fill: #ffffff; stroke-width: 1.3; }
      .flow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- ===== Band 1: 数学基础 (Blue) ===== -->
  <rect x="20" y="30" width="1060" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="20" y="30" width="140" height="100" rx="10" fill="#2563eb"/>
  <text class="ht" x="90" y="78">数学基础</text>
  <text class="hs" x="90" y="98">Mathematics</text>
  <g stroke="#2563eb">
    <rect class="card" x="180" y="48" width="163" height="64" rx="8"/>
    <rect class="card" x="359" y="48" width="163" height="64" rx="8"/>
    <rect class="card" x="538" y="48" width="163" height="64" rx="8"/>
    <rect class="card" x="717" y="48" width="163" height="64" rx="8"/>
    <rect class="card" x="896" y="48" width="163" height="64" rx="8"/>
  </g>
  <text class="ct" x="261.5" y="76">线性代数</text><text class="cs" x="261.5" y="96">Linear Algebra</text>
  <text class="ct" x="440.5" y="76">微积分</text><text class="cs" x="440.5" y="96">Calculus</text>
  <text class="ct" x="619.5" y="76">微分方程</text><text class="cs" x="619.5" y="96">ODE / PDE</text>
  <text class="ct" x="798.5" y="76">概率统计</text><text class="cs" x="798.5" y="96">Probability</text>
  <text class="ct" x="977.5" y="76">优化</text><text class="cs" x="977.5" y="96">Optimization</text>

  <!-- ===== Band 2: 物理机制 (Purple) — shorter band, bypass lane on the right ===== -->
  <rect x="20" y="180" width="880" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="20" y="180" width="140" height="100" rx="10" fill="#7c3aed"/>
  <text class="ht" x="90" y="228">物理机制</text>
  <text class="hs" x="90" y="248">Physics</text>
  <g stroke="#7c3aed">
    <rect class="card" x="180" y="198" width="128" height="64" rx="8"/>
    <rect class="card" x="322" y="198" width="128" height="64" rx="8"/>
    <rect class="card" x="464" y="198" width="128" height="64" rx="8"/>
    <rect class="card" x="606" y="198" width="128" height="64" rx="8"/>
    <rect class="card" x="748" y="198" width="128" height="64" rx="8"/>
  </g>
  <text class="ct" x="244" y="226">经典力学</text><text class="cs" x="244" y="246">Mechanics</text>
  <text class="ct" x="386" y="226">电磁学</text><text class="cs" x="386" y="246">Electromagnetism</text>
  <text class="ct" x="528" y="226">热力学 / 统计物理</text><text class="cs" x="528" y="246">Thermo · StatMech</text>
  <text class="ct" x="670" y="226">量子力学</text><text class="cs" x="670" y="246">Quantum Mech.</text>
  <text class="ct" x="812" y="226">连续介质力学</text><text class="cs" x="812" y="246">Continuum Mech.</text>

