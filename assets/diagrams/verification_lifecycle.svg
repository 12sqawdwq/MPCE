<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" role="img" aria-label="NEEDS VERIFICATION 标记生命周期">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .ht { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .hs { font-size: 12px; fill: #ffffff; fill-opacity: 0.9; text-anchor: middle; }
      .ct { font-size: 14px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .cs { font-size: 12px; fill: #475569; text-anchor: middle; }
      .card { fill: #ffffff; stroke-width: 1.3; }
      .flow { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    </style>
  </defs>
  <rect width="1100" height="300" fill="#ffffff"/>

  <rect x="20" y="30" width="1060" height="240" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="20" y="30" width="140" height="240" rx="10" fill="#64748b"/>
  <text class="ht" x="90" y="146">核实生命周期</text>
  <text class="hs" x="90" y="166">Verification</text>

  <rect class="card" x="185" y="120" width="200" height="60" rx="8" stroke="#64748b"/>
  <text class="ct" x="285" y="143">① 添加标记</text>
  <text class="cs" x="285" y="163">[NEEDS VERIFICATION]</text>

  <rect class="card" x="435" y="120" width="170" height="60" rx="8" stroke="#d97706"/>
  <text class="ct" x="520" y="143">② 核实结果</text>
  <text class="cs" x="520" y="163">查证来源 · 复算</text>

  <rect class="card" x="680" y="46" width="380" height="56" rx="8" fill="#ffffff" stroke="#2e7d32"/>
  <text class="ct" x="870" y="69" style="fill:#2e7d32">确认正确</text>
  <text class="cs" x="870" y="89">删除标记 · 补充来源引用</text>

  <rect class="card" x="680" y="122" width="380" height="56" rx="8" stroke="#dc2626"/>
  <text class="ct" x="870" y="145" style="fill:#b91c1c">发现错误</text>
  <text class="cs" x="870" y="165">修正内容 · 记录到 CHANGELOG</text>

  <rect class="card" x="680" y="198" width="380" height="56" rx="8" stroke="#d97706"/>
  <text class="ct" x="870" y="221" style="fill:#b45309">暂时无法核实</text>
  <text class="cs" x="870" y="241">保留标记 · 说明原因与核实路径</text>

  <line class="flow" x1="385" y1="150" x2="434" y2="150"/>
  <path class="flow" d="M605,150 H640 V74 H679"/>
  <line class="flow" x1="605" y1="150" x2="679" y2="150"/>
  <path class="flow" d="M640,150 V226 H679"/>
</svg>
